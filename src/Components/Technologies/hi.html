<div>
    <div>

        <div
            className="group relative bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300">

            {/* Top: Icon + Badge */}
            <div className="flex items-start justify-between gap-4">

                {/* Icon */}
                <div
                    className="h-14 w-14 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center transition-all duration-300 group-hover:bg-linear-to-br group-hover:from-orange-50 group-hover:to-purple-50">
                    <img src={technology.icon} alt={technology.name}
                        className="h-8 w-8 object-contain transition-transform duration-300 group-hover:scale-110" />
                </div>

                {/* Badge */}
                <span
                    className="text-xs font-bold tracking-wider uppercase px-3 py-1.5 rounded-full bg-pink-50 text-[#D81B7E] border border-pink-100">
                    {technology.badge}
                </span>
            </div>


            {/* Name + Description */}
            <div className="mt-5">

                <h2
                    className="text-xl font-bold text-[#0F172A] tracking-tight group-hover:text-[#D81B7E] transition-colors duration-300">
                    {technology.name}
                </h2>

                <p className="text-sm text-[#64748B] leading-6 mt-2 line-clamp-2 min-h-12">
                    {technology.description}
                </p>

            </div>


            {/* Divider */}
            <div className="h-px w-full bg-slate-100 my-5" />


            {/* Meta Info */}
            <div className="flex items-center gap-2 text-xs font-medium">

                <span className="px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200 text-slate-600">
                    {technology.category}
                </span>

                <span className="px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200 text-slate-600">
                    {technology.difficulty}
                </span>

                {/* Rating */}
                <span className="ml-auto flex items-center gap-1 text-[#0F172A] font-bold">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="#F59E0B">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                    {technology.rating}
                </span>

            </div>


            {/* Button */}
            <button
                className="mt-5 w-full py-2.5 rounded-xl bg-[#0F172A] text-white text-sm font-semibold transition-all duration-300 group-hover:bg-linear-to-r group-hover:from-[#FF5722] group-hover:via-[#D81B7E] group-hover:to-[#7C3AED] hover:shadow-lg hover:shadow-purple-500/20 cursor-pointer">
                Add to Stack
            </button>

        </div>

    </div>
</div>
